<!DOCTYPE html>
<html>
<head>
  <title>Card List</title>
  <style>
    .card {
      border: 1px solid #ccc;
      padding: 10px;
      width: 200px;
      display: inline-block;
      margin: 10px;
    }
    .card img { width: 100%; }
  </style>
</head>
<body>
  <div id="cards"></div>
  <script>
    const students = [
      { name: "Ardit", course: "Frontend", img: "https://via.placeholder.com/200" },
      { name: "Erza", course: "Backend", img: "https://via.placeholder.com/200" },
      { name: "Liri", course: "Design", img: "https://via.placeholder.com/200" }
    ];

    let html = "";
    students.forEach(s => {
      html += `<div class="card">
                <img src="${s.img}">
                <h3>${s.name}</h3>
                <p>${s.course}</p>
              </div>`;
    });
    document.getElementById("cards").innerHTML = html;
  </script>
</body>
</html>
